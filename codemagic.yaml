workflows:
  gamehost-ios-testflight:
    name: Game Host – iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key under Codemagic → Settings → Integrations → Developer Portal.
      app_store_connect: Tallybird
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.natsimc.gamehost
    triggering:
      events: []   # manual builds only — tap "Start new build" in Codemagic
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install --filter @workspace/mobile... --frozen-lockfile
      - name: Generate native iOS project (Expo prebuild)
        script: |
          cd artifacts/mobile
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json'));c.expo.ios.buildNumber=process.env.BUILD_NUMBER;fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
          npx expo prebuild --platform ios --no-install
          cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd artifacts/mobile
          xcode-project build-ipa \
            --workspace "ios/GameHost.xcworkspace" \
            --scheme "GameHost"
    artifacts:
      - artifacts/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
