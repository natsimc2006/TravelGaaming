workflows:
  gamehost-ios-testflight:
    name: Game Host – iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name of the App Store Connect API key under Codemagic → Settings → Integrations → Developer Portal.
      app_store_connect: Tallybird
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.natsimc.gamehost
    triggering:
      events: []   # manual builds only — tap "Start new build" in Codemagic
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm@10.28.0 --force
          pnpm install --filter @workspace/mobile... --frozen-lockfile
      - name: Generate native iOS project (Expo prebuild)
        script: |
          cd artifacts/mobile
          # Build number must be higher than anything already uploaded to App Store Connect.
          # Use a UTC timestamp (always increases), unless TestFlight already has something higher.
          TS_BUILD=$(date -u +%y%m%d%H%M)
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.natsimc.gamehost --strict-match-identifier --json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" 2>/dev/null || true)
          LATEST=""
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null | tail -n 1 | tr -dc '0-9' || true)
          fi
          NEW_BUILD_NUMBER=$TS_BUILD
          if [ -n "$LATEST" ] && [ "$((LATEST + 1))" -gt "$TS_BUILD" ]; then
            NEW_BUILD_NUMBER=$((LATEST + 1))
          fi
          echo "App ID: ${APP_ID:-unknown} | latest TestFlight build: ${LATEST:-unknown} | using build number: $NEW_BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $CM_ENV
          NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json'));c.expo.ios.buildNumber=String(process.env.NEW_BUILD_NUMBER);fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
          npx expo prebuild --platform ios --no-install
          # Expo names the Xcode project after the app name (e.g. "Gimme a Game" -> GimmeaGame),
          # so look it up instead of hard-coding it. Later steps read IOS_NAME from the environment.
          IOS_NAME=$(basename "$(ls -d ios/*.xcodeproj | head -n 1)" .xcodeproj)
          echo "Xcode project name: $IOS_NAME"
          echo "IOS_NAME=$IOS_NAME" >> $CM_ENV
          echo "Bundle ID right after prebuild:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "ios/$IOS_NAME.xcodeproj/project.pbxproj"
          cd ios && pod install
          echo "Bundle ID after pod install:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$IOS_NAME.xcodeproj/project.pbxproj"
          cd ..
          # Safety net: make sure the generated project has our bundle ID and app icon.
          node scripts/ci-fix-ios.js
          # Belt and braces: write the build number straight into the native project too.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD_NUMBER" "ios/$IOS_NAME/Info.plist"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD_NUMBER;/g" "ios/$IOS_NAME.xcodeproj/project.pbxproj"
          echo "CFBundleVersion in Info.plist: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "ios/$IOS_NAME/Info.plist")"
      - name: Set up code signing
        script: |
          cd artifacts/mobile
          xcode-project use-profiles --project "ios/$IOS_NAME.xcodeproj"
      - name: Check signing (diagnostic)
        ignore_failure: true
        script: |
          echo "=== Signing identities in keychain ==="
          security find-identity -v -p codesigning
          echo
          echo "=== Provisioning profiles on this machine ==="
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "--- $f"
            security cms -D -i "$f" > /tmp/profile.plist 2>/dev/null
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist
            echo "Certificate SHA-1 fingerprints inside this profile:"
            i=0
            while /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:$i" /tmp/profile.plist > /tmp/cert.bin 2>/dev/null; do
              openssl x509 -inform DER -in /tmp/cert.bin -noout -fingerprint -sha1 -subject 2>/dev/null
              i=$((i+1))
            done
          done
          echo
          echo "=== Project signing settings after use-profiles ==="
          grep -nE "CODE_SIGN_STYLE|PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER" "artifacts/mobile/ios/$IOS_NAME.xcodeproj/project.pbxproj"
      - name: Build IPA
        script: |
          cd artifacts/mobile
          xcode-project build-ipa \
            --workspace "ios/$IOS_NAME.xcworkspace" \
            --scheme "$IOS_NAME"
          # Show the build number actually baked into the IPA before it's uploaded.
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check && unzip -q "$IPA" -d /tmp/ipa_check
          echo "IPA CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /tmp/ipa_check/Payload/*.app/Info.plist)"
    artifacts:
      - artifacts/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # internal testers get builds automatically; external beta review needs extra test info
